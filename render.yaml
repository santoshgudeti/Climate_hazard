services:
  - type: web
    name: climate-hazard-trend-analyzer
    env: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_DATABASE
        value: climate_hazard_analyzer
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGODB_URI
        sync: false # Set this in Render Dashboard Environment Variables
